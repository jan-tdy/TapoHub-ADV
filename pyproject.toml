[project]
name = "tapo-hub"
3version = "0.1.0"
description = "Home Assistant custom integration for the Tapo H100 hub (TPAP)"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.13"

# Dev/test dependencies are in requirements_test.txt (and the pinned
# python-kasa fork), not here — this project is not a pip-installable
# package, just the custom_components/ tree HACS/HA load directly.

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "ASYNC",
]
ignore = [
    "E501", # line length handled by formatter where practical; some HA-style docstrings exceed it
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.tapo_hub"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
